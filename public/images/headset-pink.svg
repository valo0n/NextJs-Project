<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#f5f5f7"/>
  <!-- Headband -->
  <path d="M100 200 Q100 80, 200 80 Q300 80, 300 200" stroke="#ec4899" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M120 180 Q120 100, 200 100 Q280 100, 280 180" stroke="#f472b6" stroke-width="10" fill="none"/>
  <!-- Earcups -->
  <ellipse cx="100" cy="230" rx="50" ry="65" fill="#ec4899"/>
  <ellipse cx="100" cy="230" rx="40" ry="55" fill="#f472b6"/>
  <ellipse cx="100" cy="230" rx="32" ry="45" fill="#db2777"/>
  <ellipse cx="300" cy="230" rx="50" ry="65" fill="#ec4899"/>
  <ellipse cx="300" cy="230" rx="40" ry="55" fill="#f472b6"/>
  <ellipse cx="300" cy="230" rx="32" ry="45" fill="#db2777"/>
  <!-- Mic -->
  <path d="M150 260 Q120 320, 100 360" stroke="#ec4899" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="100" cy="360" r="10" fill="#ec4899"/>
  <circle cx="100" cy="360" r="5" fill="#fff"/>
</svg>
