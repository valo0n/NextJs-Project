<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 533">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fae0c5"/>
      <stop offset="1" stop-color="#e8c4a3"/>
    </linearGradient>
  </defs>
  <rect width="400" height="533" fill="url(#bg2)"/>
  <!-- Body / shoulders -->
  <path d="M50 533 L50 460 Q50 400, 200 400 Q350 400, 350 460 L350 533 Z" fill="#e5e5e5"/>
  <!-- Neck -->
  <rect x="170" y="340" width="60" height="80" fill="url(#skin2)"/>
  <!-- Face oval -->
  <ellipse cx="200" cy="290" rx="75" ry="100" fill="url(#skin2)"/>
  <!-- Long hair -->
  <path d="M120 200 Q120 130, 200 130 Q280 130, 280 200 L280 450 Q260 460, 240 440 L240 280 Q240 230, 200 230 Q160 230, 160 280 L160 440 Q140 460, 120 450 Z" fill="#5a3a26"/>
  <!-- Face shape over hair -->
  <ellipse cx="200" cy="290" rx="70" ry="95" fill="url(#skin2)"/>
  <!-- Eyes -->
  <ellipse cx="175" cy="280" rx="6" ry="4" fill="#3a2419"/>
  <ellipse cx="225" cy="280" rx="6" ry="4" fill="#3a2419"/>
  <!-- Eyebrows -->
  <path d="M165 268 Q175 264, 185 268" stroke="#3a2419" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M215 268 Q225 264, 235 268" stroke="#3a2419" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M198 295 Q198 315, 202 320" stroke="#d4a585" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Lips -->
  <path d="M180 340 Q200 348, 220 340" stroke="#d65580" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
