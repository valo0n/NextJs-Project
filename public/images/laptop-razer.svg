<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f5f5f7"/>
  <!-- Screen back -->
  <rect x="150" y="80" width="500" height="320" rx="10" fill="#1a1a1a"/>
  <!-- Screen -->
  <rect x="160" y="90" width="480" height="300" rx="4" fill="#0a0a0a"/>
  <!-- Razer-like green/red light pattern -->
  <defs>
    <linearGradient id="razer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.5" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect x="160" y="90" width="480" height="300" rx="4" fill="url(#razer)" opacity="0.5"/>
  <!-- Light rays -->
  <path d="M400 240 L160 90 L160 390 Z" fill="#22c55e" opacity="0.3"/>
  <path d="M400 240 L640 90 L640 390 Z" fill="#ef4444" opacity="0.3"/>
  <!-- Camera dot -->
  <circle cx="400" cy="105" r="3" fill="#2a2a2a"/>
  <!-- Base -->
  <path d="M100 400 L700 400 L740 460 L60 460 Z" fill="#2a2a2a"/>
  <path d="M100 400 L700 400 L700 410 L100 410 Z" fill="#1a1a1a"/>
  <!-- Touchpad -->
  <rect x="350" y="425" width="100" height="25" rx="3" fill="#3a3a3a"/>
</svg>
