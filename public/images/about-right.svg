<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cart-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f5f5"/>
      <stop offset="1" stop-color="#c0c0c0"/>
    </linearGradient>
    <linearGradient id="phone-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <!-- Phone behind -->
  <rect x="180" y="60" width="120" height="200" rx="14" fill="url(#phone-grad)"/>
  <rect x="186" y="76" width="108" height="170" rx="6" fill="#ffffff"/>
  <!-- Phone screen content - shop -->
  <rect x="186" y="76" width="108" height="30" rx="6" fill="#f97316"/>
  <rect x="195" y="115" width="50" height="25" rx="3" fill="#ec4899"/>
  <text x="220" y="132" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">SALE</text>
  <rect x="195" y="150" width="90" height="20" rx="3" fill="#f5f5f5"/>
  <rect x="195" y="175" width="90" height="20" rx="3" fill="#f5f5f5"/>
  <rect x="195" y="200" width="90" height="20" rx="3" fill="#f5f5f5"/>

  <!-- Heart/like icon -->
  <circle cx="310" cy="100" r="22" fill="white"/>
  <path d="M310 110 L302 100 Q295 88, 305 88 Q310 88, 310 95 Q310 88, 315 88 Q325 88, 318 100 Z" fill="#ef4444"/>

  <!-- Shopping bag (orange) -->
  <path d="M75 220 L75 320 Q75 340, 95 340 L155 340 Q175 340, 175 320 L175 220 Z" fill="#f97316"/>
  <path d="M95 220 Q95 200, 125 200 Q155 200, 155 220" stroke="#f97316" stroke-width="6" fill="none"/>

  <!-- Shopping cart -->
  <rect x="200" y="290" width="100" height="50" rx="3" fill="url(#cart-grad)"/>
  <path d="M200 290 L195 270 L180 270" stroke="#a0a0a0" stroke-width="3" fill="none"/>
  <circle cx="215" cy="360" r="10" fill="#1a1a1a"/>
  <circle cx="285" cy="360" r="10" fill="#1a1a1a"/>
  <!-- Items in cart -->
  <rect x="210" y="295" width="20" height="40" rx="2" fill="#ec4899"/>
  <rect x="235" y="295" width="20" height="40" rx="2" fill="#7c3aed"/>
  <rect x="260" y="295" width="30" height="40" rx="2" fill="#3b82f6"/>

  <!-- Gift boxes -->
  <rect x="310" y="320" width="60" height="55" rx="3" fill="#1a1a1a"/>
  <rect x="310" y="335" width="60" height="6" fill="#f97316"/>
  <rect x="335" y="320" width="10" height="55" fill="#f97316"/>

  <!-- Leaves decoration -->
  <ellipse cx="40" cy="200" rx="8" ry="20" fill="#22c55e" opacity="0.7" transform="rotate(-20 40 200)"/>
  <ellipse cx="60" cy="190" rx="8" ry="20" fill="#16a34a" opacity="0.6" transform="rotate(20 60 190)"/>
</svg>
