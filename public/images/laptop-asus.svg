<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f5f5f7"/>
  <!-- Screen back -->
  <rect x="150" y="80" width="500" height="320" rx="10" fill="#1e3a8a"/>
  <!-- Screen -->
  <rect x="160" y="90" width="480" height="300" rx="4" fill="#1e40af"/>
  <!-- Windows-style background -->
  <defs>
    <radialGradient id="winbg">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1e40af"/>
    </radialGradient>
  </defs>
  <rect x="160" y="90" width="480" height="300" rx="4" fill="url(#winbg)"/>
  <!-- Windows 11 logo (4 squares) -->
  <rect x="380" y="200" width="18" height="18" fill="white"/>
  <rect x="402" y="200" width="18" height="18" fill="white"/>
  <rect x="380" y="222" width="18" height="18" fill="white"/>
  <rect x="402" y="222" width="18" height="18" fill="white"/>
  <!-- Taskbar -->
  <rect x="160" y="370" width="480" height="20" fill="rgba(255,255,255,0.2)"/>
  <circle cx="395" cy="380" r="6" fill="white"/>
  <!-- Camera dot -->
  <circle cx="400" cy="105" r="3" fill="#2a2a2a"/>
  <!-- Base (silver) -->
  <path d="M100 400 L700 400 L740 460 L60 460 Z" fill="#c0c0c8"/>
  <path d="M100 400 L700 400 L700 410 L100 410 Z" fill="#a8a8b0"/>
  <!-- Touchpad -->
  <rect x="350" y="425" width="100" height="25" rx="3" fill="#9a9aa2"/>
</svg>
