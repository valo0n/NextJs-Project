<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="screen-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e0e8"/>
    </linearGradient>
    <linearGradient id="base-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d8e0"/>
      <stop offset="1" stop-color="#a8a8b0"/>
    </linearGradient>
  </defs>
  <!-- Screen back -->
  <path d="M80 80 L320 80 L320 250 L80 250 Z" fill="#c0c0c8"/>
  <!-- Screen front -->
  <rect x="85" y="85" width="230" height="160" rx="4" fill="url(#screen-grad)"/>
  <!-- Screen content - chart -->
  <rect x="100" y="110" width="80" height="80" rx="3" fill="#3b82f6" opacity="0.7"/>
  <rect x="105" y="170" width="10" height="15" fill="#7c3aed"/>
  <rect x="120" y="160" width="10" height="25" fill="#a855f7"/>
  <rect x="135" y="145" width="10" height="40" fill="#ec4899"/>
  <rect x="150" y="155" width="10" height="30" fill="#3b82f6"/>
  <rect x="165" y="140" width="10" height="45" fill="#06b6d4"/>
  <!-- Content right side -->
  <rect x="195" y="110" width="105" height="15" rx="2" fill="#7c3aed"/>
  <rect x="195" y="135" width="80" height="8" rx="2" fill="#a0a0a8"/>
  <rect x="195" y="150" width="90" height="8" rx="2" fill="#a0a0a8"/>
  <rect x="195" y="165" width="70" height="8" rx="2" fill="#a0a0a8"/>
  <rect x="195" y="185" width="60" height="20" rx="3" fill="#3b82f6"/>
  <!-- Base / keyboard area -->
  <path d="M40 250 L360 250 L380 290 L20 290 Z" fill="url(#base-grad)"/>
  <!-- Touchpad -->
  <rect x="170" y="265" width="60" height="15" rx="2" fill="#888"/>
  <!-- Glow at bottom -->
  <ellipse cx="200" cy="310" rx="160" ry="15" fill="#7c3aed" opacity="0.2"/>
</svg>
