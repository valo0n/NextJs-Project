<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg-desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0a3a"/>
      <stop offset="1" stop-color="#0a0518"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-desk)"/>
  <!-- RGB glow -->
  <rect x="0" y="220" width="400" height="3" fill="#ec4899" opacity="0.7"/>
  <rect x="0" y="225" width="400" height="2" fill="#a855f7" opacity="0.5"/>
  <!-- Desk top -->
  <rect x="40" y="200" width="320" height="20" rx="3" fill="#0f0f0f"/>
  <rect x="40" y="200" width="320" height="6" rx="3" fill="#2a2a2a"/>
  <!-- Monitor -->
  <rect x="120" y="80" width="160" height="100" rx="6" fill="#0f0f0f"/>
  <rect x="125" y="85" width="150" height="85" rx="3" fill="#1a1a3a"/>
  <!-- Monitor content -->
  <rect x="135" y="95" width="40" height="60" rx="2" fill="#a855f7" opacity="0.7"/>
  <rect x="185" y="95" width="80" height="30" rx="2" fill="#3b82f6" opacity="0.7"/>
  <rect x="185" y="135" width="80" height="20" rx="2" fill="#ec4899" opacity="0.7"/>
  <!-- Monitor stand -->
  <rect x="190" y="180" width="20" height="20" fill="#0f0f0f"/>
  <rect x="170" y="195" width="60" height="5" rx="2" fill="#1a1a1a"/>
  <!-- Keyboard on desk -->
  <rect x="130" y="225" width="140" height="20" rx="3" fill="#1a1a1a"/>
  <!-- Mouse -->
  <ellipse cx="290" cy="235" rx="15" ry="8" fill="#1a1a1a"/>
  <!-- Legs -->
  <rect x="60" y="220" width="15" height="160" fill="#0f0f0f"/>
  <rect x="325" y="220" width="15" height="160" fill="#0f0f0f"/>
</svg>
