  </defs>
  <rect width="400" height="533" fill="url(#bg1)"/>
  <!-- Body / shoulders -->
  <path d="M50 533 L50 460 Q50 400, 200 400 Q350 400, 350 460 L350 533 Z" fill="#1a1a1a"/>
