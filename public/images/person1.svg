  <!-- Glasses -->
  <circle cx="172" cy="285" r="22" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="228" cy="285" r="22" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="194" y1="285" x2="206" y2="285" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Eyes -->
  <circle cx="172" cy="285" r="4" fill="#3a2419"/>
  <circle cx="228" cy="285" r="4" fill="#3a2419"/>
  <!-- Mouth/smile -->
